<style>
.ap { display: grid; gap: var(--cds-gap-lg); font-family: var(--font-anthropic-sans); }
.ap h1 { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); margin: 0; }
.ap-take { color: var(--color-fg-muted); margin: var(--cds-gap-xs) 0 0; font-size: var(--cds-font-size-body); }
.ap-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: var(--cds-gap-md); }
.ap-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); min-width: 0; }
.ap-card h2 { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); margin: 0; }
.ap-note { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); margin: var(--cds-gap-xs) 0 var(--cds-gap-md); }
.ap-tile .ap-num { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); font-variant-numeric: tabular-nums; min-height: 1.3em; display: block; }
.ap-tile .ap-label { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.ap-tile.ap-attn .ap-num { color: var(--color-warn); }
.ap-wrap { overflow: auto; max-height: 34rem; }
.ap table { width: 100%; border-collapse: collapse; font-size: var(--cds-font-size-body); font-variant-numeric: tabular-nums; }
.ap th { text-align: left; font-weight: var(--cds-font-weight-medium); color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); position: sticky; top: 0; background: var(--color-panel); padding: var(--cds-pad-xs) var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); white-space: nowrap; }
.ap td { padding: var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); vertical-align: top; }
.ap td.ap-q { max-width: 22rem; color: var(--color-warn); }
.ap td.ap-muted, .ap .ap-muted { color: var(--color-fg-muted); }
.ap-pill { display: inline-block; padding: 0 var(--cds-pad-sm); border-radius: 999px; border: 1px solid var(--color-border-line); font-size: var(--cds-font-size-caption); white-space: nowrap; }
.ap-pill.ap-ok { color: var(--color-ok); border-color: currentColor; }
.ap-pill.ap-warn { color: var(--color-warn); border-color: currentColor; }
.ap-pill.ap-bad { color: var(--color-bad); border-color: currentColor; }
.ap-empty { color: var(--color-fg-muted); padding: var(--cds-pad-md) 0; }
.ap-fail { display: flex; align-items: center; justify-content: center; gap: var(--cds-gap-xs); color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); min-height: 4rem; }
.ap-fail::before { content: ""; width: .375rem; height: .375rem; border-radius: 50%; background: var(--color-bad); }
[data-dash-source-state=empty] { color: transparent; }
[data-dash-source-state=refreshing] { opacity: .5; transition: opacity var(--cds-dur-slow); }
@media (max-width: 40rem) { .ap .ap-hide-narrow { display: none; } }
</style>

<div class="ap">
  <header id="top">
    <h1>Autopilot</h1>
    <p class="ap-take" id="takeaway"><span class="dash-skeleton">—</span></p>
  </header>

  <section class="ap-tiles" id="figures">
    <div class="ap-card ap-tile">
      <span class="ap-num dash-skeleton" data-source="summary" data-field="active" data-row="0">—</span>
      <span class="ap-label">En cours (interview, construction, revue)</span>
    </div>
    <div class="ap-card ap-tile ap-attn">
      <span class="ap-num dash-skeleton" data-source="summary" data-field="waiting" data-row="0">—</span>
      <span class="ap-label">T'attendent (go, questions, blocage)</span>
    </div>
    <div class="ap-card ap-tile">
      <span class="ap-num dash-skeleton" data-source="summary" data-field="done" data-row="0">—</span>
      <span class="ap-label">Terminées (14 derniers jours)</span>
    </div>
  </section>

  <section class="ap-card" id="tasks">
    <h2>Longues tâches</h2>
    <p class="ap-note">Une ligne par session. Mise à jour par Claude à chaque changement de phase.</p>
    <div class="ap-wrap" id="tasks-box">
      <table data-source="tasks" data-row-key="session">
        <thead><tr>
          <th data-field="title">Tâche</th>
          <th data-field="project" class="ap-hide-narrow">Projet</th>
          <th data-field="phase">Phase</th>
          <th data-field="for_you">Questions pour toi</th>
          <th data-field="verdict">Verdict</th>
          <th data-field="updated_label" class="ap-hide-narrow">Mis à jour</th>
          <th data-field="session" class="ap-hide-narrow">Session</th>
        </tr></thead>
        <tbody id="tasks-body"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
dash.calc('summary', {
  title: 'Compteurs des tâches',
  description: "Compte les tâches en cours, celles qui t'attendent et celles terminées.",
  inputs: ['tasks'],
  fn: (tasks) => {
    const attn = (t) => t.phase === 'Attend ton go' || t.phase === 'Bloquée' || t.phase === 'En pause' || t.waiting !== '' || Number(t.pending_count) > 0;
    return [{
      active: tasks.filter((t) => ['Interview', 'En construction', 'Revue hostile'].includes(t.phase)).length,
      waiting: tasks.filter((t) => t.phase !== 'Terminée' && attn(t)).length,
      done: tasks.filter((t) => t.phase === 'Terminée').length,
    }];
  },
});

(function () {
  const PILL = { 'Terminée': 'ap-ok', 'Attend ton go': 'ap-warn', 'En pause': 'ap-warn', 'Bloquée': 'ap-bad' };
  const VERDICT = { 'À LIVRER': 'ap-ok', 'À CORRIGER': 'ap-warn', 'À REVOIR': 'ap-bad' };
  const pill = (text, cls) => {
    const span = document.createElement('span');
    span.className = 'ap-pill' + (cls ? ' ' + cls : '');
    span.textContent = text;
    return span;
  };

  dash.onData(() => {
    const t = dash.data('tasks');
    const s = dash.data('summary');
    const body = document.getElementById('tasks-body');
    const box = document.getElementById('tasks-box');
    const take = document.getElementById('takeaway');
    box.querySelectorAll('.ap-fail, .ap-empty').forEach((n) => n.remove());
    body.replaceChildren();

    document.querySelectorAll('[data-source="summary"]').forEach((el) => {
      if (s.status === 'ok' && s.data[0]) {
        el.classList.remove('dash-skeleton');
        el.textContent = String(s.data[0][el.dataset.field]);
      } else if (s.status === 'error' || t.status === 'error') {
        el.classList.remove('dash-skeleton');
        el.textContent = '—';
      }
    });

    if (t.status === 'error' || t.status === 'missing') {
      const f = document.createElement('div');
      f.className = 'ap-fail';
      f.textContent = 'Failed to load';
      box.append(f);
      take.textContent = '';
      return;
    }
    if (t.status !== 'ok') return;

    const rows = t.data;
    if (s.status === 'ok' && s.data[0]) {
      const { active, waiting } = s.data[0];
      take.textContent = rows.length === 0
        ? "Aucune longue tâche pour l'instant. Elles apparaissent ici dès qu'une tâche est lancée."
        : waiting > 0
          ? `${waiting} tâche${waiting > 1 ? 's' : ''} t'attend${waiting > 1 ? 'ent' : ''} : regarde la colonne Questions pour toi.`
          : `${active} tâche${active > 1 ? 's' : ''} en cours, rien ne t'attend.`;
    }

    if (rows.length === 0) {
      const e = document.createElement('div');
      e.className = 'ap-empty';
      e.textContent = 'Aucune tâche. Décris une longue tâche à Claude : elle apparaîtra ici.';
      box.append(e);
      return;
    }

    rows.forEach((r) => {
      const tr = document.createElement('tr');
      const cells = [
        r.title,
        r.project,
        null,
        r.for_you,
        null,
        r.updated_label,
        r.session,
      ];
      cells.forEach((v, i) => {
        const td = document.createElement('td');
        if (i === 1 || i === 5 || i === 6) td.classList.add('ap-hide-narrow', 'ap-muted');
        if (i === 2) td.append(pill(r.phase, PILL[r.phase]));
        else if (i === 4) { if (r.verdict) td.append(pill(r.verdict, VERDICT[r.verdict])); }
        else td.textContent = v;
        if (i === 3) td.className = 'ap-q';
        tr.append(td);
      });
      body.append(tr);
    });
  });
})();
</script>
